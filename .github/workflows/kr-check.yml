# 한국어판 하니스 검사. LLM을 쓰지 않고 비밀키도 필요 없다.
# 스크립트 문법, 실행별 검증(반려가 있으면 실패), 실행 ID 중복, 항목 출력 구조 검사, 파이프라인 상태표, ✅ 절의 한국 적합성 게이트를 본다.
name: 한국어판 검사

on:
  push:
    branches: [main]
    paths:
      - book-kr/**
      - kr-harness/**
      - .claude/**
      - KR-GUIDE.md
      - .github/workflows/kr-check.yml
  pull_request:
    paths:
      - book-kr/**
      - kr-harness/**
      - .claude/**
      - KR-GUIDE.md
      - .github/workflows/kr-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API 키 의존 금지(LLM은 구독 로그인 세션·routine에서만)
        run: |
          if grep -rnE --exclude=kr-check.yml 'claude-code-action|secrets\.(ANTHROPIC|CLAUDE)|ANTHROPIC_API_KEY:' .github/workflows; then
            echo "::error::워크플로에 Claude API 키·토큰 의존이 생겼습니다. kr-harness/CLOUD.md 참고"; exit 1
          fi
      - name: 스크립트 문법
        run: for f in .claude/hooks/*.mjs .claude/skills/*/scripts/*.mjs; do node --check "$f"; done
      - name: 세션 시작 훅
        run: CLAUDE_PROJECT_DIR="$PWD" node .claude/hooks/session-start.mjs
      - name: 실행별 검증(반려 시 실패)
        run: node .claude/skills/kr-verify/scripts/verify.mjs --check
      # 실행 ID 형식(R + 절 번호 + 절 안 순번, 예 R18a)과 폴더·config 일치, ID 중복을 본다.
      # 브랜치 여럿을 합치다 같은 ID 폴더가 둘 생기면 여기서 실패한다(규칙은 run-id.mjs 머리말).
      - name: 실행 ID 규칙과 중복
        run: node .claude/skills/kr-pipeline/scripts/run-id.mjs --self-test --check
      - name: 항목 출력 구조 검사(통과 못 한 항목은 원문 유지됐는지 경고만)
        run: |
          for f in kr-harness/runs/*/entries/e-[0-9][0-9].md; do
            [ -e "$f" ] || continue
            node .claude/skills/kr-refine/scripts/entries.mjs check "$f" >/dev/null || echo "::warning file=$f::구조 검사 실패 — 7-refined.md에는 원문이 들어가야 함"
          done
      - name: 파이프라인 상태
        run: node .claude/skills/kr-pipeline/scripts/pipeline.mjs status >> "$GITHUB_STEP_SUMMARY"
      # book-kr/README.md 표에서 ✅인 절마다 ① kr-fit --check(block 0) ② kr-harness/chapters/NN/kr-fit-review.md 마지막 줄
      # KR-FIT: pass blockers=0 ③ 그 줄의 sha256=이 지금 본문 해시(kr-fit.mjs NN --hash)와 같음. 해시가 없거나 다르면
      # 「리뷰가 본문보다 오래됨 → 재검토 필요」로 실패한다. 게이트를 못 넘는 절은 고치거나 pipeline.mjs gate N --demote로 🟨로 내린다.
      # gate는 --save 없이 돌리므로 작업 트리에 아무것도 쓰지 않는다.
      - name: 한국 적합성 게이트
        run: |
          set -o pipefail  # 기본 셸은 bash -e라 pipefail이 없어, gate | tee의 실패가 tee 종료코드에 묻힌다
          rc=0
          node .claude/skills/kr-verify/scripts/kr-fit.mjs --all-done --check || rc=1
          { echo '## 한국 적합성 게이트'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node .claude/skills/kr-pipeline/scripts/pipeline.mjs gate --all-done | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error::✅ 절 중 한국 적합성 게이트(kr-fit·KR-FIT 리뷰)를 통과하지 못한 절이 있습니다."; fi
          exit $rc
